<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11151b" />
    <title>Factory 2D</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SIMULATION PROTOTYPE</p>
          <h1>Factory <span>2D</span></h1>
        </div>
        <div class="simulation-state" aria-live="polite">
          <span class="state-light" id="state-light"></span>
          <span id="state-label">BUILD MODE</span>
          <span class="tick-counter" id="tick-counter">TICK 0000</span>
        </div>
      </header>

      <section class="workspace">
        <aside class="sidebar" aria-label="Tile palette">
          <div class="panel-heading">
            <span>COMPONENTS</span>
            <span class="panel-number">01</span>
          </div>
          <div class="palette" id="palette">
            <button class="palette-item selected" data-tile="sand" type="button">
              <span class="swatch sand-swatch"></span>
              <span><strong>Sand</strong><small>Falls one cell per tick</small></span>
              <kbd>1</kbd>
            </button>
            <button class="palette-item" data-tile="stone" type="button">
              <span class="swatch stone-swatch"></span>
              <span><strong>Stone</strong><small>Fixed structural block</small></span>
              <kbd>2</kbd>
            </button>
            <button class="palette-item" data-tool="weld" type="button">
              <span class="swatch weld-swatch"></span>
              <span><strong>Weld</strong><small>Join adjacent blocks into one body</small></span>
              <kbd>3</kbd>
            </button>
            <button class="palette-item" data-tile="empty" type="button">
              <span class="swatch eraser-swatch"></span>
              <span><strong>Erase</strong><small>Remove a block</small></span>
              <kbd>0</kbd>
            </button>
          </div>
          <div class="instructions">
            <p><span>PLACE / WELD</span> Left click or drag</p>
            <p><span>REMOVE / UNWELD</span> Right click or drag</p>
            <p><span>RUN / PAUSE</span> Space</p>
            <p><span>STEP</span> N</p>
          </div>
        </aside>

        <section class="board-panel" aria-label="Factory simulation">
          <div class="board-frame" id="board-frame">
            <canvas id="game-canvas" aria-label="Editable tile simulation grid"></canvas>
          </div>
          <div class="coordinates" id="coordinates">X -- &nbsp; Y --</div>
        </section>
      </section>

      <footer class="controls">
        <div class="transport">
          <button class="primary-control" id="play-button" type="button">▶ RUN</button>
          <button id="step-button" type="button">STEP</button>
          <button id="reset-button" type="button">RESET</button>
          <button id="clear-button" type="button">CLEAR</button>
        </div>
        <label class="speed-control">
          SIMULATION SPEED
          <select id="speed-select">
            <option value="1">1 tick / sec</option>
            <option value="2">2 ticks / sec</option>
            <option value="5" selected>5 ticks / sec</option>
            <option value="10">10 ticks / sec</option>
          </select>
        </label>
        <p class="build-note">Build while paused. Reset restores the last edited layout.</p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
